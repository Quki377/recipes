<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="菜谱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>我的菜谱</title>
<style>
  :root{
    --bg:#FAF7F2;
    --card:#FFFFFF;
    --text:#1C1B19;
    --muted:#8C867C;
    --line:#EDE7DD;
    --radius:16px;
    --max:680px;
  }
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .top{
    position:sticky;top:0;z-index:10;
    background:rgba(250,247,242,.92);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    padding:18px 16px 10px;
  }
  .top-inner{max-width:var(--max);margin:0 auto;}
  .title{font-size:20px;font-weight:600;letter-spacing:.02em;margin:0 0 14px;}
  .search{position:relative;}
  .search svg{
    position:absolute;left:15px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;stroke:var(--muted);fill:none;
    stroke-width:2;stroke-linecap:round;pointer-events:none;
  }
  .search input{
    width:100%;padding:12px 16px 12px 42px;
    font-size:15px;font-family:inherit;color:var(--text);
    background:var(--card);border:1px solid var(--line);
    border-radius:999px;outline:none;appearance:none;-webkit-appearance:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .search input:focus{border-color:#D9D1C3;box-shadow:0 0 0 3px rgba(28,27,25,.05);}
  .search input::placeholder{color:#B4AEA4;}
  .tabs{
    display:flex;gap:8px;margin-top:12px;padding-bottom:4px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;padding:7px 16px;font-size:14px;font-family:inherit;
    color:var(--text);background:var(--card);border:1px solid var(--line);
    border-radius:999px;cursor:pointer;white-space:nowrap;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .tab.active{background:var(--text);color:#fff;border-color:var(--text);}
  .list{
    max-width:var(--max);margin:0 auto;
    padding:16px 16px calc(40px + env(safe-area-inset-bottom));
    display:grid;gap:12px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;cursor:pointer;
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .card:active{transform:scale(.985);}
  @media (hover:hover){.card:hover{box-shadow:0 6px 22px rgba(28,27,25,.06);}}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .card-head h2{margin:0;font-size:17px;font-weight:600;line-height:1.4;}
  .badge{
    flex:0 0 auto;padding:3px 10px;font-size:12px;line-height:1.5;
    color:var(--muted);background:#F3EFE7;border-radius:999px;white-space:nowrap;
  }
  .desc{margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--muted);}
  .empty{padding:56px 20px;text-align:center;font-size:14px;color:var(--muted);}
  .detail{
    position:fixed;inset:0;z-index:50;background:var(--bg);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translateY(100%);pointer-events:none;
    transition:transform .32s cubic-bezier(.32,.72,0,1);
  }
  .detail.open{transform:translateY(0);pointer-events:auto;}
  .detail-inner{max-width:var(--max);margin:0 auto;padding:0 20px calc(64px + env(safe-area-inset-bottom));}
  .detail-bar{
    position:sticky;top:0;z-index:2;padding:14px 0 12px;
    background:rgba(250,247,242,.94);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
  }
  .back{
    display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
    font-size:14px;font-family:inherit;color:var(--text);
    background:var(--card);border:1px solid var(--line);
    border-radius:999px;cursor:pointer;transition:opacity .15s ease;
  }
  .back:active{opacity:.65;}
  .detail h1{margin:6px 0 12px;font-size:24px;font-weight:600;line-height:1.35;letter-spacing:.01em;}
  .meta{margin-bottom:30px;}
  .section-title{
    margin:0 0 12px;padding-bottom:8px;font-size:13px;font-weight:600;
    letter-spacing:.14em;color:var(--muted);border-bottom:1px solid var(--line);
  }
  .ingredients{list-style:none;margin:0 0 34px;padding:0;font-size:15px;}
  .ingredients li{position:relative;padding:9px 0 9px 18px;border-bottom:1px dashed var(--line);}
  .ingredients li:last-child{border-bottom:none;}
  .ingredients li::before{
    content:"";position:absolute;left:2px;top:18px;
    width:5px;height:5px;border-radius:50%;background:#CFC7B9;
  }
  .steps{list-style:none;counter-reset:step;margin:0;padding:0;}
  .steps li{
    counter-increment:step;position:relative;padding:0 0 20px 38px;
    font-size:15px;line-height:1.75;
  }
  .steps li:last-child{padding-bottom:0;}
  .steps li::before{
    content:counter(step);position:absolute;left:0;top:2px;
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;color:var(--muted);
    background:#F1ECE3;border-radius:50%;
  }

  /* ===== 买菜清单 ===== */
  .card{position:relative;}
  .card-head{padding-right:34px;}
  .pick{
    position:absolute;right:16px;top:16px;
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    font-size:15px;line-height:1;color:#C6BFB2;
    background:#F6F2EA;border:1px solid var(--line);border-radius:50%;
    cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease;
    user-select:none;
  }
  .pick:active{transform:scale(.92);}
  .pick.on{background:var(--text);border-color:var(--text);color:#fff;}
  .card.picked{border-color:#C9C1B2;box-shadow:0 0 0 2px rgba(28,27,25,.045);}

  .addbtn{
    display:inline-flex;align-items:center;gap:6px;margin:0 0 22px;padding:9px 18px;
    font-size:14px;font-family:inherit;color:var(--text);
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .addbtn.on{background:var(--text);border-color:var(--text);color:#fff;}

  .cartbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:none;justify-content:center;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(250,247,242,.92);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-top:1px solid var(--line);
  }
  .cartbar.show{display:flex;}
  .cartbar button{
    width:100%;max-width:var(--max);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 22px;font-size:15px;font-family:inherit;color:#fff;
    background:var(--text);border:none;border-radius:999px;cursor:pointer;
  }
  .cartbar button:active{opacity:.85;}
  .cartbar .cnt{font-weight:600;}
  .cartbar .go{opacity:.8;font-size:14px;}

  .sheet{
    position:fixed;inset:0;z-index:60;background:var(--bg);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translateY(100%);pointer-events:none;
    transition:transform .32s cubic-bezier(.32,.72,0,1);
  }
  .sheet.open{transform:translateY(0);pointer-events:auto;}
  .sheet-inner{max-width:var(--max);margin:0 auto;padding:0 20px calc(40px + env(safe-area-inset-bottom));}
  .sheet-bar{
    position:sticky;top:0;z-index:2;padding:14px 0 12px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:rgba(250,247,242,.94);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
  }
  .sheet-bar .sp{flex:1;}
  .sheet h1{margin:6px 0 4px;font-size:24px;font-weight:600;line-height:1.35;}
  .sheet .sub{margin:0 0 24px;font-size:14px;color:var(--muted);}

  .group{margin-bottom:26px;}
  .group-head{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:10px 0;margin:0;font-size:14px;font-weight:600;font-family:inherit;
    color:var(--text);background:none;border:none;border-bottom:1px solid var(--line);
    cursor:pointer;text-align:left;
  }
  .group-head .arrow{font-size:11px;color:var(--muted);transition:transform .2s ease;}
  .group-head.fold .arrow{transform:rotate(-90deg);}
  .group-head .n{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted);}
  .group-body{padding-top:4px;}
  .group-head.fold + .group-body{display:none;}

  .bline{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px 0;border-bottom:1px dashed var(--line);
    font-size:15px;line-height:1.6;cursor:pointer;
  }
  .bline:last-child{border-bottom:none;}
  .bline .box{
    flex:0 0 auto;width:18px;height:18px;margin-top:3px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff;background:var(--card);
    border:1px solid #D6CFC1;border-radius:5px;
  }
  .bline.done .box{background:#8C867C;border-color:#8C867C;}
  .bline.done .txt{color:#B4AEA4;text-decoration:line-through;}
  .bline .txt{flex:1;}
  .bline .amt{color:var(--muted);font-size:13px;}
  .bline .alt{font-size:12px;color:var(--muted);}

  .sheet-foot{margin-top:8px;display:grid;gap:10px;}
  .sheet-foot button{
    padding:13px 20px;font-size:15px;font-family:inherit;color:var(--text);
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    cursor:pointer;
  }
  .sheet-foot button:active{opacity:.7;}
  .sheet-foot button.primary{background:var(--text);color:#fff;border-color:var(--text);}

  /* ===== 全屏 / 桌面 App 模式微调 ===== */
  @media (display-mode: standalone){
    .top{padding-top:calc(10px + env(safe-area-inset-top));}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <h1 class="title">我的菜谱</h1>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
      <input id="searchInput" type="search" placeholder="搜索菜名或食材…" autocomplete="off">
    </div>
    <nav id="tabs" class="tabs" aria-label="菜谱分类"></nav>
  </div>
</header>

<main id="list" class="list"></main>

<div id="cartbar" class="cartbar">
  <button id="cartOpen" type="button">
    <span class="cnt">已选 0 道</span>
    <span class="go">查看买菜单 ›</span>
  </button>
</div>

<div id="sheet" class="sheet" aria-hidden="true">
  <div class="sheet-inner">
    <div class="sheet-bar">
      <button class="back" data-close type="button">← 返回</button>
      <span class="sp"></span>
      <button class="back" id="copyBtn" type="button">复制文字</button>
    </div>
    <h1>买菜清单</h1>
    <p class="sub" id="sheetSub"></p>
    <div id="sheetBody"></div>
    <div class="sheet-foot">
      <button type="button" id="clearDone">清掉已打勾的</button>
      <button type="button" class="primary" id="clearAll">清空清单</button>
    </div>
  </div>
</div>

<div id="detail" class="detail" aria-hidden="true">
  <div class="detail-inner">
    <div class="detail-bar"><button class="back" data-close>← 返回</button></div>
    <div id="detailBody"></div>
  </div>
</div>

<script>
/* =========================================================
   数据区：60 道菜谱
   分类：炖卤 / 鸡肉鸭肉 / 猪肉 / 牛羊肉海鲜 / 小炒 / 主食 / 汤凉菜
   ========================================================= */
const RECIPES = [
  {
    id:1, name:"家常卤牛腱子", category:"炖卤",
    desc:"冷藏一夜再切，淋一勺原汤，非常过瘾。",
    ingredients:["牛腱子 3 斤","葱 手掌长一段（切斜大块）","姜 1/4 个手掌大（切片）","香菜根 1 个（洗净保留）","八角 3 个","香叶 4—5 片","白芷 2 薄片","草果 1 个（必须剪开）","干辣椒 3 个（不吃辣可不放）","小茴香 1 捏","花椒粒 1 捏","黄豆酱 满满 2 勺","生抽 200 克（较咸减为 150 克）","冰糖 20 克","盐 1 茶勺","老抽 2 勺（可选）","开水 适量（至少与肉齐平）"],
    steps:["泡血水：牛腱子提前泡去血水，排酸好的泡半小时，普通牛肉泡 2 小时。","焯水：冷水下锅什么都不用放，水开再煮 1 分钟，捞出用温水洗净浮沫。","煎姜片：油微热下姜片，中火煎至带一圈焦边。","煎葱和香菜根：下葱段和香菜根，煎至葱段散开、出现焦边。","炒香料：转最小火，下所有香料快速翻炒出香味（花椒糊了会发苦）。","炒黄豆酱：加满满两勺黄豆酱，最小火炒香。","熬酱汁：加生抽和冰糖，大火把酱油煮开。","炖煮：下牛肉立刻加开水，至少与肉齐平，加 1 茶勺盐。大火烧开盖盖转最小火，有嚼劲炖 1.5 小时，软烂炖 2 小时，高压锅压 20 分钟。可加 2 勺老抽加深颜色。","判断熟度：筷子轻轻一插就透，拔出稍有阻力，成熟度刚好。","冷藏入味：连汤带肉盛出，汤过滤去渣，不热后放冰箱冷藏一夜。","切盘：切厚一点，淋一勺原汤，非常过瘾。"]
  },
  {
    id:2, name:"香料炖羊排（可涮火锅）", category:"炖卤",
    desc:"复合香料加秘制酱料，可当火锅锅底。",
    ingredients:["羊排 3 斤","胡萝卜 适量（切大块）","姜 1/4 个手掌大（切片）","葱 手掌长一段（斜切段）","香菜 一把","桂皮 2g","香叶 3 片","草果皮 1 个（剪开抠籽只留皮）","良姜 2g","白蔻 3 个","白芷 5g","毛砂仁 3g","丁香 3 粒","白胡椒粉 3g","花椒粒 3g","甘草 2g","孜然粒 10g","干辣椒 10g","郫县豆瓣酱 满满 2 勺","甜面酱 满满 1 勺","白糖 2 平勺","鸡精 满满 1 叉勺","蚝油 满满 1 勺","老抽 2/3 勺","盐 约 2 克","食用油 适量（炒菜量 2—3 倍）"],
    steps:["泡羊肉：清水浸泡半小时去血水，控干后用厨房纸吸干水分。","泡香料：全部香料清水泡 3 分钟去苦涩和灰尘，沥干。","炒葱姜：多油，油微热下葱姜，大火炒至葱起气泡转中火炒香，大葱金黄马上转最小火。","炒酱：最小火下甜面酱和郫县豆瓣酱，炒出红油后下香料，最小火炒匀。","炒羊排：下羊排转最大火炒 2 分钟，加开水（把锅壁料化下来）。","高压锅压制：连汤带肉倒入高压锅，加胡萝卜块。涮火锅水加到最大水位线，只吃肉水没过羊肉即可。选牛羊肉功能；无高压锅多加水小火炖 1 个半小时。","后期调味：肉汤倒回小锅，加白糖、鸡精、蚝油、老抽。涮火锅直接按口味加盐煮开撒香菜；收汁则先别放盐，大火收浓拣料渣，最后加约 2 克盐撒香菜。"]
  },
  {
    id:3, name:"红烧筋头巴脑", category:"炖卤",
    desc:"番茄膏点睛，收汁留一点拌饭极香。",
    ingredients:["筋头巴脑 2 斤","姜 1/6 个手心大（切片）","大葱 手心长一段（一切两瓣）","大蒜 4 粒（压扁）","香叶 3 片","草果 1 个（去籽留皮）","八角 2 个","桂皮 1 小块（千万别多）","白芷 1 块","干辣椒 适量","郫县豆瓣酱 1 平勺","黄豆酱 1 平勺","番茄膏 2 满勺（没有用番茄酱 1 勺代替）","食用油 适量（多一点）","黄酒 2 勺","生抽 3 勺","蚝油 半勺","开水 将将没过牛肉","白胡椒粉 一点点","冰糖 5—6 小块","鸡精 2 茶勺","香菜 适量"],
    steps:["清洗切块：冷冻筋头巴脑多洗几遍，大的切大块。","冷水焯水：冷水下锅水要多，加葱姜边角料、一捏花椒、一小圈高度白酒，大火不停扒拉辅助出血沫。","关火洗净：水大开后关火，捞出用温水仔细冲洗干净。","备料：草果去籽留皮，干辣椒切段，碗中调匀三种酱。","炒小料：凉油下葱姜蒜，大火炒至葱起泡、姜蒜微焦黄。","炒香料：下所有香料炒香，转最小火。","炒酱：下三种酱最小火炒匀，锅温降下来后调回大火不停翻炒出酱香。","炒牛肉：下筋头巴脑立刻炒匀防糊底，大火炒 1 分多钟，沿锅边淋 2 勺黄酒炒至酒气挥发。","调味：最小火淋 3 勺生抽、半勺蚝油炒匀，加开水将将没过牛肉，加白胡椒粉、冰糖、鸡精搅匀。","高压锅：燃气高压锅上气后最小火压 25—30 分钟；电子高压锅选牛羊肉压 35 分钟。","收汁出锅：先把肉拣出来，汤过滤料渣，肉和汤回锅收汁至略微粘稠，装盘撒香菜，盖米饭浇汤汁。"]
  },
  {
    id:4, name:"无水炖牛腩", category:"炖卤",
    desc:"不加水，靠泡水后的牛肉自带原汁，肉烂汤鲜。",
    ingredients:["牛腩或牛肋条 3 斤（至少 1 斤半，必须铺满锅底）","生抽 5 勺","老抽 2 勺半","蚝油 满满 1 勺","白胡椒粉 2/3 茶勺","白糖 1 茶勺","八角 2 个","香叶 1 片","姜 4 片","胡萝卜 1 个","土豆 1 个","葱花、香菜 适量"],

/* =========================================================
   逻辑区
   ========================================================= */
const $list        = document.getElementById('list');
const $tabs        = document.getElementById('tabs');
const $search      = document.getElementById('searchInput');
const $detail      = document.getElementById('detail');
const $detailBody  = document.getElementById('detailBody');

const $cartbar    = document.getElementById('cartbar');
const $cartOpen    = document.getElementById('cartOpen');
const $sheet       = document.getElementById('sheet');
const $sheetBody   = document.getElementById('sheetBody');
const $sheetSub    = document.getElementById('sheetSub');

const state = { keyword: '', category: '全部' };

/* ---------- 买菜清单：勾选与本地保存 ---------- */
const LS_PICK = 'myrecipes.picked.v1';
const LS_DONE = 'myrecipes.done.v1';

function loadSet(key){
  try { return new Set(JSON.parse(localStorage.getItem(key) || '[]').map(String)); }
  catch(e){ return new Set(); }
}
function saveSet(key, set){
  try { localStorage.setItem(key, JSON.stringify([...set])); } catch(e){}
}
let picked = loadSet(LS_PICK);   // 已选菜谱 id
let done   = loadSet(LS_DONE);   // 已买到的食材 key

function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[c]);
}

function renderTabs(){
  const cats = ['全部', ...new Set(RECIPES.map(r => r.category))];
  $tabs.innerHTML = cats.map(c => `
    <button class="tab${c === state.category ? ' active' : ''}" data-cat="${esc(c)}">${esc(c)}</button>
  `).join('');
}

function getFilteredRecipes(){
  const kw = state.keyword.trim().toLowerCase();
  return RECIPES.filter(r => {
    if (state.category !== '全部' && r.category !== state.category) return false;
    if (!kw) return true;
    const haystack = [r.name, r.desc || '', ...(r.ingredients || [])].join(' ').toLowerCase();
    return haystack.includes(kw);
  });
}

function renderList(){
  const data = getFilteredRecipes();
  if (data.length === 0){
    $list.innerHTML = `<p class="empty">没有找到相关菜谱，换个关键词试试～</p>`;
    return;
  }
  $list.innerHTML = data.map(r => `
    <article class="card${picked.has(String(r.id)) ? ' picked' : ''}" data-id="${esc(r.id)}">
      <span class="pick${picked.has(String(r.id)) ? ' on' : ''}" data-pick="${esc(r.id)}" role="button" aria-label="加入买菜单">${picked.has(String(r.id)) ? '\u2713' : '+'}</span>
      <div class="card-head">
        <h2>${esc(r.name)}</h2>
        <span class="badge">${esc(r.category)}</span>
      </div>
      <p class="desc">${esc(r.desc || '')}</p>
    </article>
  `).join('');
}

/* ---------- 购物车条 ---------- */
function renderCartBar(){
  const n = picked.size;
  $cartbar.classList.toggle('show', n > 0);
  $cartOpen.querySelector('.cnt').textContent = '已选 ' + n + ' 道';
}

function openDetail(id){
  const recipe = RECIPES.find(r => String(r.id) === String(id));
  if (!recipe) return;
  const on = picked.has(String(recipe.id));
  $detailBody.innerHTML = `
    <h1>${esc(recipe.name)}</h1>
    <div class="meta"><span class="badge">${esc(recipe.category)}</span></div>
    <button class="addbtn${on ? ' on' : ''}" id="addBtn" type="button" data-id="${esc(recipe.id)}">${on ? '\u2713 已在买菜单' : '+ 加入买菜单'}</button>
    <h2 class="section-title">食材</h2>
    <ul class="ingredients">
      ${(recipe.ingredients || []).map(i => `<li>${esc(i)}</li>`).join('')}
    </ul>
    <h2 class="section-title">步骤</h2>
    <ol class="steps">
      ${(recipe.steps || []).map(s => `<li>${esc(s)}</li>`).join('')}
    </ol>
  `;
  $detail.scrollTop = 0;
  $detail.classList.add('open');
  $detail.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closeDetail(){
  $detail.classList.remove('open');
  $detail.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

$search.addEventListener('input', e => {
  state.keyword = e.target.value;
  renderList();
});

$tabs.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  state.category = btn.dataset.cat;
  renderTabs();
  renderList();
});

$list.addEventListener('click', e => {
  const pickEl = e.target.closest('[data-pick]');
  if (pickEl){
    e.stopPropagation();
    togglePick(pickEl.dataset.pick);
    return;
  }
  const card = e.target.closest('.card');
  if (!card) return;
  if (e.target.closest('[data-cart-open]')) return;
  openDetail(card.dataset.id);
});

function togglePick(id){
  id = String(id);
  if (picked.has(id)) picked.delete(id); else picked.add(id);
  saveSet(LS_PICK, picked);
  renderList();
  renderCartBar();
  renderSheet();
}

$detailBody.addEventListener('click', e => {
  const btn = e.target.closest('#addBtn');
  if (!btn) return;
  const id = String(btn.dataset.id);
  if (picked.has(id)) picked.delete(id); else picked.add(id);
  saveSet(LS_PICK, picked);
  const on = picked.has(id);
  btn.classList.toggle('on', on);
  btn.textContent = on ? '\u2713 已在买菜单' : '+ 加入买菜单';
  renderList();
  renderCartBar();
  renderSheet();
});

$cartOpen.addEventListener('click', openSheet);

$detail.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) closeDetail();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $detail.classList.contains('open')) closeDetail();
});

/* =========================================================
   买菜清单：解析食材 → 分组 → 渲染
   ========================================================= */

const GROUP_ORDER = ['肉蛋', '水产', '蔬菜', '菌菇豆制品', '主食', '调料', '其他'];

const GROUP_RULES = [
  ['肉蛋', ['五花肉','猪肉','肉末','肉丝','肉片','肉条','里脊','排骨','牛','羊','鸡','鸭','鹅','猪','鸡蛋','蛋','腊肉','香肠','火腿','培根','腊肠','猪油','蹄','肘','腱子','腩','肋','骨','虾','蟹','鱼']],
  ['菌菇豆制品', ['木耳','黄花菜','香菇','蘑菇','金针菇','杏鲍菇','银耳','腐竹','豆腐','豆干','豆皮','千张','豆芽','花生米','花生','腰果','核桃','板栗','莲子','枸杞','红枣']]
];

const SPICE_KEYS = ['八角','桂皮','香叶','花椒','麻椒','干辣椒','辣椒段','白芷','草果','白蔻','良姜','砂仁','丁香','甘草','孜然','小茴香','小茴','陈皮','山柰','荜拨','胡椒','十三香','五香粉','罗勒','迷迭香','百里香','香茅','咖喱','桂皮','草寇','红蔻','栀子','白胡椒','黑胡椒','干姜','香菜籽','毕拨','肉蔻','白果','干香茅'];

const SEASON_KEYS = ['生抽','老抽','酱油','盐','糖','油','醋','酱','酒','鸡精','味精','蚝油','淀粉','面粉','料酒','黄酒','米酒','醪糟','辣椒面','辣椒粉','胡椒粉','芝麻','香油','盐焗','叉烧','柱侯','海鲜','番茄','芝麻酱','花生酱','豆瓣','腐乳','豆豉','甜面酱','蒸鱼豉油','东古一品鲜','味极鲜','鱼露','芥末','蜂蜜','麦芽糖','红油','辣椒油','花椒油','辣油','芝麻','白芝麻','黑芝麻','小苏打','泡打粉','酵母','食用碱','纯碱','糖色','鸡汁','蘑菇精','十三香','五香粉','调味','汤料','火锅底料','牛油','猪油','黄油','起司','芝士','酱料','腌料','刷料','脆皮水','皮水'];

function groupOf(name){
  const n = name;

  // 先判调料（很多名字里带“油/酱/粉”但其实要看具体）
  if (SPICE_KEYS.some(k => n.includes(k))) return '调料';
  if (SEASON_KEYS.some(k => n.includes(k))) return '调料';

  // 肉蛋 / 水产
  if (['虾','蟹','鱼','贝','蛤','蚝','鱿鱼','海参','蛏'].some(k => n.includes(k))) return '水产';
  for (const [g, keys] of GROUP_RULES){
    if (keys.some(k => n.includes(k))) return g;
  }

  // 蔬菜（默认大类，剩下大多是这个）
  const VEG = ['茄子','土豆','番茄','西红柿','黄瓜','白菜','青菜','菠菜','生菜','油菜','芹','韭','葱','蒜','姜','椒','萝卜','瓜','菇','藕','笋','豆角','荷兰豆','山药','芋头','玉米','南瓜','西葫芦','茼蒿','荠菜','芥蓝','莴笋','洋葱','秋葵','紫苏','薄荷','藿香','苋菜','芸豆','扁豆','豌豆','蒜苗','蒜薹','青笋','泡椒','酸菜','梅干菜','香椿','茴香苗','辣皮子','辣椒','朝天椒','灯笼椒','杭椒','线椒','美人椒','小米辣','二荆条'];
  if (VEG.some(k => n.includes(k))) return '蔬菜';

  // 主食
  if (['米','面','条','粉','麦','馍','饼','馒头','饺子','年糕','粉丝','米粉','河粉','意大利面','吐司','面包'].some(k => n.includes(k))) return '主食';

  return '其他';
}

// 去掉【分类】标记
function cleanName(raw){
  return String(raw).replace(/^【[^】]*】/, '').trim();
}

// 解析单条食材 → { name, amount, alt }
function parseIngredient(rawStr){
  let s = cleanName(rawStr);

  // 剥掉括号内容（但保留“或”判断需要的信息）
  let note = '';
  const noteMatch = s.match(/[（(]([^）)]*)[）)]/g);
  if (noteMatch) note = noteMatch.join(' ');

  let body = s.replace(/[（(][^）)]*[）)]/g, '').trim();

  // “生姜一小块、大蒜” 这类没有空格但有“、”的，拆开
  let alt = false;
  if (/或/.test(body)) alt = true;

  // 找第一个空格，前半是名字，后半是量
  let name = body, amount = '';
  const m = body.match(/^(\S+?)\s+(.+)$/);
  if (m){
    name = m[1];
    amount = m[2];
  } else {
    // 名字里可能含“、”或“/”，拆成多条
    name = body;
  }

  // 名字里带“或”的，取第一个当主名
  if (/或/.test(name)){
    const parts = name.split(/或/);
    name = parts[0];
    alt = true;
  }

  // 名字里带“、”的，拆成数组（如“鸭脖、鸭头、鸭肠”）
  let names = [name];
  if (/、/.test(name)) names = name.split(/、/).filter(Boolean);

  // 名字里的“/” 如 土豆/红薯淀粉
  const expanded = [];
  for (const nm of names){
    if (/\//.test(nm)){
      nm.split('/').forEach(x => { if (x) expanded.push(x); });
      alt = true;
    } else {
      expanded.push(nm);
    }
  }

  return expanded.map(nm => ({
    name: nm,
    amount: amount,
    alt: alt,
    note: note
  }));
}

// 汇总
function buildShoppingList(){
  const buckets = {};   // 组 → { name → { amounts:Set, alts:Set, recipes:[] } }
  for (const g of GROUP_ORDER) buckets[g] = {};

  const chosen = RECIPES.filter(r => picked.has(String(r.id)));

  for (const r of chosen){
    for (const raw of (r.ingredients || [])){
      // 一条食材可能拆成多条
      const parts = parseIngredient(raw);
      for (const p of parts){
        if (!p.name) continue;
        const g = groupOf(p.name);
        if (!buckets[g][p.name]) buckets[g][p.name] = { amounts: [], alt: false, recipes: [] };
        const entry = buckets[g][p.name];
        if (p.amount && !entry.amounts.includes(p.amount)) entry.amounts.push(p.amount);
        if (p.alt) entry.alt = true;
        if (!entry.recipes.includes(r.name)) entry.recipes.push(r.name);
      }
    }
  }
  return { buckets, chosen };
}

function ingKey(g, name){ return g + '|' + name; }

function renderSheet(){
  if (!picked.size){
    $sheetBody.innerHTML = '<p class="empty">还没有选菜。回到列表，点菜谱右上角的 <b>+</b> 就能加进来。</p>';
    $sheetSub.textContent = '';
    return;
  }
  const { buckets, chosen } = buildShoppingList();

  let totalItems = 0;
  for (const g of GROUP_ORDER) totalItems += Object.keys(buckets[g]).length;

  $sheetSub.textContent = chosen.length + ' 道菜 · 共 ' + totalItems + ' 项食材';
  $sheetSub.textContent += '　｜　' + chosen.map(r => r.name).join('、');

  let html = '';
  for (const g of GROUP_ORDER){
    const names = Object.keys(buckets[g]).sort((a, b) => a.localeCompare(b, 'zh'));
    if (!names.length) continue;

    // 调料组默认折叠
    const fold = (g === '调料');
    html += '<section class="group">';
    html += '<button class="group-head' + (fold ? ' fold' : '') + '" type="button" data-group="' + esc(g) + '">';
    html += '<span class="arrow">▾</span><span>' + esc(g) + '</span><span class="n">' + names.length + ' 项</span>';
    html += '</button>';
    html += '<div class="group-body">';
    for (const nm of names){
      const e = buckets[g][nm];
      const k = ingKey(g, nm);
      const isDone = done.has(k);
      const amt = e.amounts.join(' + ');
      html += '<div class="bline' + (isDone ? ' done' : '') + '" data-ing="' + esc(k) + '">';
      html += '<span class="box">' + (isDone ? '✓' : '') + '</span>';
      html += '<span class="txt">' + esc(nm);
      if (e.alt) html += ' <span class="alt">（任选）</span>';
      if (amt) html += ' <span class="amt">' + esc(amt) + '</span>';
      html += '</span></div>';
    }
    html += '</div></section>';
  }
  $sheetBody.innerHTML = html;
}

function openSheet(){
  renderSheet();
  $sheet.classList.add('open');
  $sheet.setAttribute('aria-hidden', 'false');
  $sheet.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function closeSheet(){
  $sheet.classList.remove('open');
  $sheet.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

$sheet.addEventListener('click', e => {
  if (e.target.closest('[data-close]')){ closeSheet(); return; }

  const head = e.target.closest('.group-head');
  if (head){ head.classList.toggle('fold'); return; }

  const line = e.target.closest('[data-ing]');
  if (line){
    const k = line.dataset.ing;
    if (done.has(k)) done.delete(k); else done.add(k);
    saveSet(LS_DONE, done);
    renderSheet();
    return;
  }
});

document.getElementById('clearDone').addEventListener('click', () => {
  done.clear();
  saveSet(LS_DONE, done);
  renderSheet();
});

document.getElementById('clearAll').addEventListener('click', () => {
  if (!confirm('清空整张清单？选中的菜也会取消。')) return;
  picked.clear();
  done.clear();
  saveSet(LS_PICK, picked);
  saveSet(LS_DONE, done);
  renderList();
  renderCartBar();
  renderSheet();
});

document.getElementById('copyBtn').addEventListener('click', async () => {
  const { buckets, chosen } = buildShoppingList();
  if (!chosen.length) return;
  let txt = '买菜清单（' + chosen.length + ' 道菜）\n';
  txt += chosen.map(r => '· ' + r.name).join('\n') + '\n\n';
  for (const g of GROUP_ORDER){
    const names = Object.keys(buckets[g]).sort((a, b) => a.localeCompare(b, 'zh'));
    if (!names.length) continue;
    txt += '【' + g + '】\n';
    for (const nm of names){
      const e = buckets[g][nm];
      const amt = e.amounts.join(' + ');
      txt += '  ' + nm + (amt ? '  ' + amt : '') + (e.alt ? '（任选）' : '') + '\n';
    }
    txt += '\n';
  }
  try {
    await navigator.clipboard.writeText(txt);
    const btn = document.getElementById('copyBtn');
    const old = btn.textContent;
    btn.textContent = '已复制 ✓';
    setTimeout(() => { btn.textContent = old; }, 1400);
  } catch(err){
    alert('复制失败，可以长按选中文字手动复制。');
  }
});

renderTabs();
renderList();
renderCartBar();
</script>
